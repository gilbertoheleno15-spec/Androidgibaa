
name: Build Meu Assistente IA APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MeuAssistenteIA_Etapa2_Integracao_IA.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto Android
        run: unzip -q MeuAssistenteIA_Etapa2_Integracao_IA.zip

      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK de teste
        working-directory: MeuAssistenteIA
        run: gradle --no-daemon assembleDebug

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: MeuAssistenteIA-debug
          path: MeuAssistenteIA/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
